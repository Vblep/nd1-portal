<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Approve Uploaded Photos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f8f8;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #004080;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      overflow: hidden;
      text-align: center;
    }
    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .card p {
      margin: 10px 0;
      padding: 0 10px;
    }
    .card button {
      background: #004080;
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
      width: 50%;
      font-size: 14px;
    }
    .card button.reject {
      background: crimson;
    }
    .card button:hover {
      opacity: 0.9;
    }
    #unauthorized, #loading {
      color: red;
      text-align: center;
      margin-top: 30px;
    }
    #loading {
      color: #004080;
    }
  </style>
</head>
<body>
  <h1 id="title">📥 Approve Pending Photos</h1>
  <p id="loading">Loading...</p>
  <p id="unauthorized" style="display:none;">Access Denied: Only admins can view this page.</p>
  <div class="grid" id="pendingGrid" style="display:none;"></div>  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDkMtk-2mYbg_wEzSHRJ--z8NeQYfIWesQ",
      authDomain: "nd1portal.firebaseapp.com",
      projectId: "nd1portal",
      storageBucket: "nd1portal.appspot.com",
      messagingSenderId: "428976722721",
      appId: "1:428976722721:web:d15b86d70275ae30dda460"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const pendingGrid = document.getElementById("pendingGrid");
    const unauthorizedMsg = document.getElementById("unauthorized");
    const loadingMsg = document.getElementById("loading");
    const title = document.getElementById("title");

    onAuthStateChanged(auth, user => {
      if (!user) {
        window.location.href = "auth.html";
        return;
      }
      if (user.email !== "ebuvick0@gmail.com") {
        unauthorizedMsg.style.display = "block";
        title.style.display = "none";
        loadingMsg.style.display = "none";
        return;
      }
      loadingMsg.style.display = "none";
      pendingGrid.style.display = "grid";
      loadPendingPhotos();
    });

    async function loadPendingPhotos() {
      const snapshot = await getDocs(collection(db, "pendingUploads"));
      if (snapshot.empty) {
        pendingGrid.innerHTML = '<p style="text-align:center;color:#004080;">No pending uploads.</p>';
        return;
      }

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const url = data.url || data.imageUrl || "";

        const imgHTML = url ? `<img src="${url}" alt="Pending Photo" onerror="this.src='https://via.placeholder.com/200?text=Image+Error'">` : "<div style='height:200px;line-height:200px;'>No image</div>";

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          ${imgHTML}
          <p><strong>Caption:</strong> ${data.caption || "No caption"}</p>
          <p><strong>Uploader:</strong> ${data.uploader || "Unknown"}</p>
          <div style="display:flex">
            <button onclick="approvePhoto('${docSnap.id}', '${url}', \`${data.caption || ""}\`, \`${data.uploader || ""}\`)">Approve</button>
            <button class="reject" onclick="rejectPhoto('${docSnap.id}')">Reject</button>
          </div>
        `;
        pendingGrid.appendChild(card);
      });
    }

    window.approvePhoto = async function(id, url, caption, uploader) {
      await addDoc(collection(db, "approvedUploads"), {
        url,
        caption,
        uploader,
        timestamp: Date.now()
      });
      await deleteDoc(doc(db, "pendingUploads", id));
      alert("✅ Photo approved!");
      location.reload();
    }

    window.rejectPhoto = async function(id) {
      await deleteDoc(doc(db, "pendingUploads", id));
      alert("❌ Photo rejected and deleted.");
      location.reload();
    }
  </script></body>
</html>
