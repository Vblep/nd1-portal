<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Forum</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
    h1 { color: #004080; text-align: center; }
    #postForm, .post-card { max-width: 600px; margin: 20px auto; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    textarea { width: 100%; height: 80px; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
    button { padding: 8px 16px; background: #004080; color: white; border: none; border-radius: 5px; cursor: pointer; }
    .post-card h3 { margin: 0; color: #004080; }
    .post-card p { margin-top: 5px; }
    .meta { font-size: 0.8em; color: gray; }
  </style>
</head>
<body>
  <h1>💬 ND1 Student Forum</h1>
  <div id="postForm">
    <textarea id="postText" placeholder="Start a discussion..."></textarea>
    <button onclick="submitPost()">Post</button>
  </div>  <div id="forumPosts"></div>  <script>
    const posts = JSON.parse(localStorage.getItem("forumPosts") || "[]");
    const forumContainer = document.getElementById("forumPosts");

    function renderPosts() {
      forumContainer.innerHTML = posts.map(post => `
        <div class="post-card">
          <h3>${post.name}</h3>
          <p>${post.text}</p>
          <div class="meta">Posted on ${new Date(post.time).toLocaleString()}</div>
        </div>
      `).join('');
    }

    function submitPost() {
      const text = document.getElementById("postText").value.trim();
      if (!text) return alert("Please write something.");
      const name = prompt("Enter your name:") || "Anonymous";
      posts.unshift({ name, text, time: Date.now() });
      localStorage.setItem("forumPosts", JSON.stringify(posts));
      document.getElementById("postText").value = "";
      renderPosts();
    }

    renderPosts();
  </script></body>
</html>
