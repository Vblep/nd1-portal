<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Polls</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }
    h1 {
      color: #004080;
    }
    .poll {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 500px;
      margin: auto;
    }
    .poll button {
      margin-top: 10px;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 5px;
      background: #004080;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    .results {
      margin-top: 20px;
      background: #eef;
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>📊 Student Poll</h1>
  <div class="poll">
    <p><strong>What's your preferred study time?</strong></p>
    <button onclick="vote('morning')">☀️ Morning</button>
    <button onclick="vote('afternoon')">🌞 Afternoon</button>
    <button onclick="vote('night')">🌙 Night</button>
    <div class="results" id="results"></div>
  </div>  <script>
    const resultsDiv = document.getElementById('results');

    function vote(option) {
      const currentVotes = JSON.parse(localStorage.getItem('pollVotes') || '{}');
      currentVotes[option] = (currentVotes[option] || 0) + 1;
      localStorage.setItem('pollVotes', JSON.stringify(currentVotes));
      showResults();
    }

    function showResults() {
      const votes = JSON.parse(localStorage.getItem('pollVotes') || '{}');
      const total = Object.values(votes).reduce((a, b) => a + b, 0) || 1;
      resultsDiv.innerHTML = Object.entries(votes).map(([key, val]) => {
        const percent = ((val / total) * 100).toFixed(1);
        return `<p><strong>${key}:</strong> ${val} votes (${percent}%)</p>`;
      }).join('');
    }

    showResults();
  </script></body>
</html>
