<!DOCTYPE html><html lang="en">  
<head>  
  <meta charset="UTF-8" />  
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>  
  <title>Gallery</title>  
  <style>  
    body { font-family: sans-serif; margin: 0; background: #f0f0f0; }  
    header { padding: 1em; background: #004080; color: white; text-align: center; position: relative; }  
    #galleryContainer { padding: 1em; }  
    .post { background: white; margin-bottom: 1em; border-radius: 10px; padding: 1em; box-shadow: 0 2px 6px rgba(0,0,0,0.1); position: relative; }  
    .post img.main, .post video.main { width: 100%; max-height: 300px; object-fit: cover; border-radius: 8px; cursor: pointer; }  
    .caption { margin-top: 0.5em; font-weight: bold; }  
    .meta { font-size: 0.8em; color: gray; display: flex; align-items: center; gap: 6px; margin-top: 5px; }  
    .meta img { width: 25px; height: 25px; border-radius: 50%; }  
    .actions { margin-top: 0.5em; font-size: 0.9em; display: flex; align-items: center; gap: 10px; }  
    .emoji-btn { font-size: 18px; cursor: pointer; }  
    .comment-box { display: flex; gap: 4px; margin-top: 0.5em; }  
    .comment-box input { flex: 1; padding: 8px; border-radius: 5px; border: 1px solid #ccc; }  
    .comment-box button { padding: 6px 10px; border-radius: 5px; border: none; background: #004080; color: white; }  
    .floating-btn { position: fixed; bottom: 20px; right: 20px; background: #004080; color: white; font-size: 28px; width: 50px; height: 50px; border-radius: 50%; text-align: center; line-height: 50px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); cursor: pointer; }  
    .dark-toggle, .notify-btn { position: absolute; top: 12px; font-size: 20px; cursor: pointer; }  
    .dark-toggle { right: 10px; }  
    .notify-btn { right: 45px; }  
    .comment { font-size: 0.9em; margin: 5px 0; }  
    .comment img { width: 20px; height: 20px; border-radius: 50%; vertical-align: middle; margin-right: 6px; }  
    #notificationPanel {  
      display: none;  
      position: fixed;  
      top: 60px;  
      right: 10px;  
      width: 90%;  
      max-width: 300px;  
      background: white;  
      border: 1px solid #ccc;  
      border-radius: 8px;  
      padding: 1em;  
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);  
      z-index: 9999;  
    }  
    .notification-item { font-size: 0.9em; padding: 0.5em 0; border-bottom: 1px solid #eee; }  
  </style>  
</head>  
<body>  
  <header>  
    📸 School Gallery  
    <span class="notify-btn" id="notify">🔔</span>  
    <span class="dark-toggle" id="darkToggle">🌙</span>  
  </header>  
  <div id="notificationPanel"></div>  
  <div id="galleryContainer">Loading...</div>  
  <a class="floating-btn" href="create-post.html">+</a>    <script type="module">  
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";  
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";  
    import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, arrayUnion, query, orderBy, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";  

    const firebaseConfig = {  
      apiKey: "AIzaSyDkMtk-2mYbg_wEzSHRJ--z8NeQYfIWesQ",  
      authDomain: "nd1portal.firebaseapp.com",  
      projectId: "nd1portal",  
      storageBucket: "nd1portal.appspot.com",  
      messagingSenderId: "428976722721",  
      appId: "1:428976722721:web:d15b86d70275ae30dda460"  
    };  

    const app = initializeApp(firebaseConfig);  
    const auth = getAuth();  
    const db = getFirestore();  
    const container = document.getElementById("galleryContainer");  
    const notifyPanel = document.getElementById("notificationPanel");  
    const notifyBtn = document.getElementById("notify");  
    const darkToggle = document.getElementById("darkToggle");  
    let currentUser;  

    onAuthStateChanged(auth, async (user) => {  
      if (!user) return (container.innerHTML = "Please log in to view gallery.");  
      currentUser = user;  
      loadGallery();  
      loadNotifications();  
    });  

    darkToggle.onclick = () => document.body.classList.toggle("dark-mode");  
    notifyBtn.onclick = () => {  
      notifyPanel.style.display = notifyPanel.style.display === "block" ? "none" : "block";  
    };  

    async function loadNotifications() {  
      const snap = await getDocs(collection(db, `users/${currentUser.uid}/notifications`));  
      notifyPanel.innerHTML = "";  
      snap.forEach(doc => {  
        const n = doc.data();  
        notifyPanel.innerHTML += `<div class='notification-item'>${n.message}</div>`;  
      });  
    }  

    async function loadGallery() {  
      const q = query(collection(db, "approvedUploads"), orderBy("timestamp", "desc"));  
      const snapshot = await getDocs(q);  
      container.innerHTML = "";  

      for (const docSnap of snapshot.docs) {  
        const data = docSnap.data();  
        const id = docSnap.id;  
        let userData = {};  
        try {  
          const profile = await getDoc(doc(db, "users", data.uploader));  
          if (profile.exists()) userData = profile.data();  
        } catch {}  

        const mediaElement = data.type === "video"  
          ? `<video class="main" controls src="${data.url}"></video>`  
          : `<img class="main" src="${data.url}" onclick="window.location.href='post.html?id=${id}'">`;  

        const postDiv = document.createElement("div");  
        postDiv.className = "post";  
        postDiv.innerHTML = `  
          ${mediaElement}  
          <div class="caption">${data.caption || "No caption"}</div>  
          <div class="meta">  
            <img src="${userData.photo || 'https://i.imgur.com/placeholder-profile.png'}">  
            <span>${userData.username || "Unknown User"}</span>  
            <span>• ${new Date(data.timestamp).toLocaleString()}</span>  
          </div>  
          <div class="actions">  
            <span class="emoji-btn" onclick="likePost('${id}')">❤️ ${data.likes?.length || 0}</span>  
            <span class="emoji-btn">💬 ${data.comments?.length || 0}</span>  
          </div>  
          <div class="comments" id="comments-${id}">  
            ${(data.comments || []).map(c => `  
              <div class="comment">  
                <img src="${c.photo || 'https://i.imgur.com/placeholder-profile.png'}">  
                <strong>${c.name || 'User'}</strong>: ${c.text}  
              </div>`).join('')}  
          </div>  
          <div class="comment-box">  
            <input placeholder="Write a comment..." onkeydown="if(event.key==='Enter') addComment('${id}', this)">  
            <button onclick="addComment('${id}', this.previousElementSibling)">➤</button>  
          </div>  
        `;  
        container.appendChild(postDiv);  
      }  
    }  

    window.likePost = async (id) => {  
      const ref = doc(db, "approvedUploads", id);  
      const snap = await getDoc(ref);  
      const post = snap.data();  
      if (!post.likes.includes(currentUser.email)) {  
        await updateDoc(ref, { likes: arrayUnion(currentUser.email) });  

        if (currentUser.email !== post.uploader) {  
          const userRef = doc(db, "users", post.uploader);  
          const snap = await getDoc(userRef);  
          if (snap.exists()) {  
            await addDoc(collection(db, `users/${post.uploader}/notifications`), {  
              message: `${currentUser.email} liked your post.`,  
              time: Date.now()  
            });  
          }  
        }  
        loadGallery();  
      }  
    };  

    window.addComment = async (id, input) => {  
      const text = input.value.trim();  
      if (!text) return;  
      const ref = doc(db, "approvedUploads", id);  
      const profile = await getDoc(doc(db, "users", currentUser.uid));  
      const userData = profile.exists() ? profile.data() : {};  
      await updateDoc(ref, {  
        comments: arrayUnion({ text, time: Date.now(), name: userData.username || "Anonymous", photo: userData.photo || "" })  
      });  
      input.value = "";  
      loadGallery();  
    };  
  </script>  </body>  
</html>
